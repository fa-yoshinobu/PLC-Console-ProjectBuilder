name: .NET CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "true"
  SOLUTION: dotnet/PLCConsoleProjectBuilder.sln
  WPF_PROJECT: dotnet/src/PLCConsoleProjectBuilder.Wpf/PLCConsoleProjectBuilder.Wpf.csproj

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect documentation-only changes
        id: filter
        shell: python
        run: |
          import json, os, subprocess
          from pathlib import PurePosixPath

          def documentation(path):
              return path in {"README.md", "CHANGELOG.md"} or (
                  path.startswith("docs/") and PurePosixPath(path).suffix == ".md"
              )

          with open(os.environ["GITHUB_EVENT_PATH"]) as source:
              event = json.load(source)
          files = []
          if os.environ["GITHUB_EVENT_NAME"] == "pull_request":
              pr = event["pull_request"]
              revision = pr["base"]["sha"] + "..." + pr["head"]["sha"]
          elif os.environ["GITHUB_EVENT_NAME"] == "push" and event["before"].strip("0"):
              revision = event["before"] + ".." + event["after"]
          else:
              revision = None
          if revision:
              files = subprocess.check_output([
                  "git", "diff", "--name-only", "--no-renames", "-z", revision
              ]).decode().split("\0")[:-1]
          code = not files or not all(documentation(path) for path in files)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"code={str(code).lower()}\n")

  build-test:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    name: Build and test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore $env:SOLUTION

      - name: Build
        run: dotnet build $env:SOLUTION --configuration Release --no-restore

      - name: Test
        run: dotnet test $env:SOLUTION --configuration Release --no-build --verbosity normal

      - name: Publish WPF smoke test
        run: >
          dotnet publish $env:WPF_PROJECT
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output "$env:RUNNER_TEMP\plcio-publish"
          /p:PublishSingleFile=true
          /p:IncludeNativeLibrariesForSelfExtract=true
          /p:EnableCompressionInSingleFile=true
          /p:DebugType=None
          /p:DebugSymbols=false

      - name: Verify publish output
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:RUNNER_TEMP "plcio-publish"
          $exe = Join-Path $publishDir "PLCConsoleProjectBuilder.exe"
          $languagesDir = Join-Path $publishDir "Languages"

          if (-not (Test-Path -LiteralPath $exe)) {
            throw "Expected publish output is missing: $exe"
          }

          if (-not (Test-Path -LiteralPath $languagesDir)) {
            throw "Expected language JSON output directory is missing: $languagesDir"
          }

          foreach ($languageFileName in @("en.json", "ja.json")) {
            $languageFile = Join-Path $languagesDir $languageFileName
            if (-not (Test-Path -LiteralPath $languageFile)) {
              throw "Expected language JSON file is missing: $languageFile"
            }
          }
